[project]
name = "waddle-desktop"
version = "0.1.0"
description = "Waddle's host side: the penguin, overlays, sensors and CLI"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "waddle-core",
    "PySide6-Essentials>=6.10,<6.13",
    "dbus-fast>=2.44",
]

[project.scripts]
waddle = "waddle_desktop.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waddle_desktop"]

[tool.hatch.build.targets.wheel.force-include]
"../../kwin/waddle-core.js" = "waddle_desktop/_data/kwin/waddle-core.js"

[tool.uv.sources]
waddle-core = { workspace = true }
