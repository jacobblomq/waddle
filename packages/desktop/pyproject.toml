[project]
name = "waddle-desktop"
version = "0.1.0"
description = "Waddle's host side: the penguin, overlays, sensors and CLI"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "waddle-core",
    "PySide6-Essentials>=6.10,<6.13",
    "dbus-fast>=2.44",
    "websockets>=15.0",
]

[project.scripts]
waddle = "waddle_desktop.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waddle_desktop"]

[tool.hatch.build.targets.wheel.force-include]
"../../kwin/waddle-core.js" = "waddle_desktop/_data/kwin/waddle-core.js"
"../../kwin/waddle-cursor.js" = "waddle_desktop/_data/kwin/waddle-cursor.js"
# Without this list Waddle refuses to start (it must know which windows are private).
"../../knowledge/privacy" = "waddle_desktop/_data/knowledge/privacy"
# First-party app packs; identity.packs.default_packs_dir() looks for them here.
"../../knowledge/apps" = "waddle_desktop/_data/knowledge/apps"

[tool.uv.sources]
waddle-core = { workspace = true }
