[project]
name = "waddle-core"
version = "0.1.0"
description = "Shared schemas, protocol and pure logic for Waddle (no I/O)"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = ["pydantic>=2.14,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waddle_core"]
